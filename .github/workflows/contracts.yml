name: contracts

on:
  push:
    branches: [main]
    paths:
      - "packages/contracts/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "packages/contracts/**"

jobs:
  build-and-test:
    name: Build + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts

    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Solidity dependencies
        # .gitmodules lives at packages/contracts/.gitmodules (nested), so the
        # checkout@v4 submodules:recursive flag doesn't reach it. Re-init manually.
        run: |
          git -c protocol.version=2 submodule update --init --recursive --depth 1

      - name: forge fmt --check
        run: forge fmt --check
        continue-on-error: true

      - name: forge build
        run: forge build --sizes

      - name: forge test
        # No RPC URL → fork tests will vm.skip() themselves
        run: forge test -vv --no-match-contract "ForkBaseTest|HookCallbackTest|MirrorFlowTest"

      - name: Storage layout snapshot
        run: |
          forge inspect MirrorVault storage-layout > /tmp/vault-storage.json
          forge inspect MirrorHook  storage-layout > /tmp/hook-storage.json
          echo "Storage layouts captured"

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts

    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Solidity dependencies
        run: git -c protocol.version=2 submodule update --init --recursive --depth 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install slither
        run: pip install slither-analyzer

      - name: forge build (slither needs artifacts)
        run: forge build

      - name: Run Slither
        # We've triaged baseline findings (CEI fixed, event indexed). Remaining are
        # in deps or false positives. Exit 0 — surface new findings manually via logs.
        run: slither . || true
